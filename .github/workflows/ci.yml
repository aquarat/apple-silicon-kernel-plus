# SPDX-License-Identifier: GPL-2.0-only
# Checks on every push and pull request. No secrets are used here.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: container/install-tools.sh
      - name: shellcheck
        run: |
          shellcheck -x scripts/*.sh container/install-tools.sh \
            packages/apple-ave/files/ave-load packages/apple-ave/firmware/install-firmware \
            packages/mesa-honeykrisp-plus/honeykrisp-plus
      - name: Python scripts compile
        run: |
          python3 -m py_compile scripts/asahi-kernel.py scripts/kernel-watch.py scripts/kernel-configs.py \
            packages/apple-ave/firmware/ave_fwgen.py
          python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read())' \
            packages/apple-ave/firmware/apple-ave-fetch-firmware
      - name: apple-ave tests (synthetic files, no network)
        run: python3 -m unittest discover -s packages/apple-ave/tests -v
      - name: Specs parse (rpmspec -P)
        run: |
          for s in packages/*/*.spec; do
            echo "== $s"
            rpmspec -P "$s" > /dev/null
          done
      - name: rpmlint (specs)
        run: rpmlint -c packages/rpmlint.toml packages/*/*.spec

  kernel-patches:
    # Do the patches apply to the pinned sources (packages/kernel/kernel-plus.conf),
    # and do the configs pass Fedora's checks? Builds the kernel SRPM with an
    # rpmbuild -bp check.
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: container/install-tools.sh
      - name: Kernel SRPM with prep check
        run: PREP_CHECK=1 scripts/make-srpm.sh kernel out

  srpms:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    strategy:
      fail-fast: false
      matrix:
        package: [apple-avd, apple-ave, apple-silicon-thunderbolt, mesa-honeykrisp-plus, qemu-vmapple, reims-vgpu-backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: container/install-tools.sh
      - name: Build SRPM
        run: scripts/make-srpm.sh ${{ matrix.package }} out
      - name: rpmlint (SRPM)
        run: rpmlint -c packages/rpmlint.toml out/*.src.rpm
      - name: Upload SRPM
        if: matrix.package == 'apple-avd' || matrix.package == 'apple-ave'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: srpm-${{ matrix.package }}
          path: out/*.src.rpm
          retention-days: 7
