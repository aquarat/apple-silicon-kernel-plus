# SPDX-License-Identifier: GPL-2.0-only
# Daily kernel status (scripts/kernel-watch.py):
# - starts a COPR kernel build when packages/kernel/kernel-plus.conf on the
#   default branch names a release the project has not built (that is, after
#   a maintainer's bump was merged), once its prep check passes;
# - reports, as warnings, what a maintainer should look at: the Asahi
#   branch moved, kernel.org has a newer stable release of our series,
#   @asahi publishes a kernel that sorts above ours.
# The kernel never follows upstream by itself (docs/update-policy.md).
# Uses the COPR_CONFIG secret (the contents of a copr-cli config file) only
# in the build job, which never runs for pull requests.
name: kernel-watch

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Start a kernel build even if the project already has this release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    outputs:
      build: ${{ steps.watch.outputs.build }}
      ours: ${{ steps.watch.outputs.ours }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: container/install-tools.sh
      - name: Kernel status
        id: watch
        env:
          FORCE: ${{ inputs.force }}
        run: |
          scripts/kernel-watch.py | tee -a "$GITHUB_OUTPUT"
          if [ "$FORCE" = true ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi
      - name: Report what needs a maintainer
        if: steps.watch.outputs.notices != '' || contains(steps.watch.outputs.reason, 'not retrying')
        env:
          NOTICES: ${{ steps.watch.outputs.notices }}
          REASON: ${{ steps.watch.outputs.reason }}
        run: |
          [ -z "$NOTICES" ] || echo "::warning::$NOTICES"
          case $REASON in *"not retrying"*) echo "::warning::$REASON" ;; esac
      - name: Do the patches apply, do the configs pass?
        if: steps.watch.outputs.build == 'true'
        run: PREP_CHECK=1 scripts/make-srpm.sh kernel out

  build:
    needs: check
    if: needs.check.outputs.build == 'true' && github.repository == 'aquarat/apple-silicon-kernel-plus' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install copr-cli
        run: dnf -y install --setopt=install_weak_deps=False copr-cli
      - name: Write the copr-cli config
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          test -n "$COPR_CONFIG" || { echo "::error::the COPR_CONFIG secret is not set"; exit 1; }
          umask 077
          mkdir -p "$HOME/.config"
          printf '%s\n' "$COPR_CONFIG" > "$HOME/.config/copr"
      - name: Start the kernel build
        env:
          OURS: ${{ needs.check.outputs.ours }}
        run: |
          echo "kernel $OURS"
          copr-cli build-package aquarat/apple-silicon-kernel-plus --name kernel --nowait --timeout 72000
      - name: Remove the config
        if: always()
        run: rm -f "$HOME/.config/copr"
