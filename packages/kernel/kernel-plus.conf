# Settings for the kernel SRPM (scripts/make-srpm.sh kernel). Shell syntax.

# Appended to the @asahi release: 402.asahi.fc44 becomes 402.asahi.plus1.fc44.
# "plus" sorts after "fc" in rpm's version comparison, so for the same @asahi
# release this kernel is newer than the stock one (README.md: Kernel release
# naming).
# Bump the number only when the patches change for the same @asahi release.
BUILDID=plus1

# Variants and subpackages that are not built (rpmbuild --without names).
# The result is the 16k kernel: kernel-16k, -core, -modules*, -devel,
# -devel-matched. Tools, perf, headers and debug kernels stay @asahi's.
WITHOUT="up stock debug debuginfo perf libperf tools ynl selftests doc headers cross_headers efiuki dtbloader kernel_abi_stablelists"

# The %changelog identity of our entry.
CHANGELOG_IDENTITY="aquarat <3090997+aquarat@users.noreply.github.com>"
