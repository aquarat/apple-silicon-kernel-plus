# Settings for the kernel SRPM (scripts/make-srpm.sh kernel). Shell syntax.
# packages/kernel/README.md explains how the SRPM is put together.

# The kernel source: the Asahi Linux kernel tree at one commit. The branch
# is only informational (scripts/kernel-watch.py reports when it moves);
# the build always uses ASAHI_COMMIT.
ASAHI_REPO=https://github.com/AsahiLinux/linux.git
ASAHI_BRANCH=asahi
ASAHI_COMMIT=6ba0637d1ed9a2e3639dd3fc9eca6cd0483a6434
# This project's fork of the Asahi tree keeps every commit we build from
# under a tag (plus/asahi-wip-<version>-<commit>), so the build still works
# after the Asahi branch is rebased. Used when ASAHI_REPO no longer has it.
ASAHI_MIRROR=https://github.com/aquarat/linux.git

# The stable kernel that commit is based on (its Makefile must say so).
# Source0 is kernel.org's tarball of it.
KERNEL_VERSION=7.2.15
LINUX_TARBALL_URL=https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.15.tar.xz
LINUX_TARBALL_SHA256=d0f6b1d7324c937ccaeb5c4ca7084bfcf71db2edb3e2d3a31f0ad83a681809ab

# Fedora's kernel SRPM of the same version: kernel.spec, its scripts and
# configs, and Fedora's own patch (patch-<major>-redhat.patch).
FEDORA_SRPM_URL=https://kojipkgs.fedoraproject.org/packages/kernel/7.2.15/200.fc44/src/kernel-7.2.15-200.fc44.src.rpm
FEDORA_SRPM_SHA256=d6cb54f8e7dfcc5cb01305d52016d9b816843898a4868ed431e7416d27f0c1fb

# Release = PKGRELEASE.BUILDID%{?dist}, e.g. 900.asahiwip.plus1.fc44
# (README.md: Kernel release naming).
# - PKGRELEASE: 900 for the first Asahi commit on a KERNEL_VERSION, 901,
#   902, ... for later commits on the same KERNEL_VERSION. Back to 900 when
#   KERNEL_VERSION changes.
# - BUILDID: plus1 for each new PKGRELEASE; plus2, ... when only this
#   project's patches, configs or packaging change.
PKGRELEASE=900.asahiwip
BUILDID=plus1

# Variants and subpackages that are not built (rpmbuild --without names).
# The result is the 16k kernel: kernel-16k, -core, -modules*, -devel,
# -devel-matched. Tools, perf, headers and debug kernels stay @asahi's.
WITHOUT="up stock debug debuginfo perf libperf tools ynl selftests doc headers cross_headers efiuki dtbloader kernel_abi_stablelists realtime realtime_arm64_64k arm64_64k kmap"

# The %changelog identity of our entry.
CHANGELOG_IDENTITY="aquarat <3090997+aquarat@users.noreply.github.com>"
