# /usr/lib/depmod.d/apple-avd.conf (dkms-apple-avd)
#
# DKMS installs modules under /lib/modules/<kver>/extra/, and depmod ranks
# extra/ below the kernel's own modules, so without this line modprobe keeps
# loading the in-tree apple-avd. Module names here are file names: hyphens,
# not underscores (depmod ignores a line it cannot match).
override apple-avd * extra
