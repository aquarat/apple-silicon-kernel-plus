# DKMS configuration for apple-avd (see README.md). The spec fills in the version.
PACKAGE_NAME="apple-avd"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="apple-avd"
DEST_MODULE_LOCATION[0]="/extra"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"
# The source is one kernel series' driver. A new series needs a rebase
# (scripts/rebase-avd.sh), not a build of old code against new headers;
# until then DKMS skips it and the in-tree module is used.
BUILD_EXCLUSIVE_KERNEL="^7\.1\..*asahi.*"
BUILD_EXCLUSIVE_ARCH="aarch64"
AUTOINSTALL="yes"
