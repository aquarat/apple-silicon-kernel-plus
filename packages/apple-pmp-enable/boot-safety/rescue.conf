# apple-pmp-enable, during a PMP trial only: never sit in rescue mode;
# show why on the console for 2 minutes, then restart.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'echo "apple-pmp-enable: rescue mode during a PMP trial, restarting in 120 s" > /dev/kmsg; sleep 120; systemctl --force reboot'
