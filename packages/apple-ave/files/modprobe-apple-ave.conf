# /usr/lib/modprobe.d/apple-ave.conf (dkms-apple-ave)
#
# ave-overlay applies a device-tree overlay as soon as it is loaded, and the
# overlay must match the SoC. Only apple-ave.service (ave-load) loads it, with
# the right variant. Any other load (a bare "modprobe ave_overlay", or DKMS
# loading new modules after an install) is refused here.
install ave_overlay /usr/libexec/apple-ave/ave-load modprobe-hook $CMDLINE_OPTS
