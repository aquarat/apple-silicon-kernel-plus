# SPDX-License-Identifier: GPL-2.0-only
# DKMS configuration for apple-ave (EXPERIMENTAL, see README.md).
# Two modules: the encoder driver and the device-tree overlay that describes
# the encoder (Fedora's device trees have no AVE node). Building the overlay
# headers needs dtc and python3 on the target. The spec fills in the version.
PACKAGE_NAME="apple-ave"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="apple-ave"
BUILT_MODULE_LOCATION[0]="driver/"
DEST_MODULE_LOCATION[0]="/extra"
BUILT_MODULE_NAME[1]="ave-overlay"
BUILT_MODULE_LOCATION[1]="overlay/"
DEST_MODULE_LOCATION[1]="/extra"
MAKE[0]="make -C driver KDIR=${kernel_source_dir} && make -C overlay KDIR=${kernel_source_dir}"
CLEAN="make -C driver KDIR=${kernel_source_dir} clean; make -C overlay KDIR=${kernel_source_dir} clean"
BUILD_EXCLUSIVE_ARCH="aarch64"
AUTOINSTALL="yes"
